[project]
name = "a_maze_ing"
version = "0.1.0"
description = "Awesome project"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "mypy>=1.20",
    "Flake8"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true